/* ---------- utilidades ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function hash53(str){var h1=0xdeadbeef,h2=0x41c6ce57;for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);}

function fireStore(){

    },
    fileDataUrl:async function(path){

function memStore(){
  var M={},F={};function col(c){return M[c]||(M[c]={});}
  function cp(x){return JSON.parse(JSON.stringify(x));}
  return {
    list:async function(c){return Object.keys(col(c)).map(function(id){return Object.assign({id:id},cp(col(c)[id]));});},
    get:async function(c,id){return col(c)[id]?Object.assign({id:id},cp(col(c)[id])):null;},
    set:async function(c,id,d){col(c)[id]=cp(d);},
    add:async function(c,d){var id=newId('A');col(c)[id]=cp(d);return id;},
    update:async function(c,id,d){Object.assign(col(c)[id],cp(d));},
    del:async function(c,id){delete col(c)[id];},
    setMany:async function(c,items){items.forEach(function(it){var d=Object.assign({},it);delete d.id;col(c)[it.id]=cp(d);});},
    putFile:async function(dataUrl){var id=newId('F');F[id]=dataUrl;return 'cf:'+id;},
    fileDataUrl:async function(p){if(!F[p.slice(3)])throw new Error('Archivo no encontrado.');return F[p.slice(3)];},
    removeFile:async function(p){delete F[p.slice(3)];}
  };
}
var ST=null;
var urlCache={};
async function fileUrl(path){if(urlCache[path])return urlCache[path];var blob=await (await fetch(await ST.fileDataUrl(path))).blob();urlCache[path]=URL.createObjectURL(blob);return urlCache[path];}

var S={user:null,rol:null,nombre:'',per:mesActual(),tab:'resumen',docs:[],movs:[],cartolas:[],cierres:{},obs:[],lectores:[],log:[],loading:false,movFiltro:'todos',docFiltro:'todos',q:'',demoRol:'owner',invites:[],inv:null,claiming:false};
function esDueno(){return S.rol==='owner';}
function enPer(mes){if(!mes)return false;return S.per.length===4?mes.slice(0,4)===S.per:mes===S.per;}
function cerrado(mes){return !!S.cierres[mes];}
function signo(d){return d.docTipo==='nc'?-1:1;}
function totalDoc(d){return signo(d)*(+d.total||0);}
function pagadoDoc(d){return signo(d)*((+d.total||0)-(d.docTipo==='bh'?(+d.retencion||0):0));}
function ivaDoc(d){return signo(d)*(+d.iva||0);}
function montoMov(m){return (+m.cargo||0)||(+m.abono||0);}
function dirMov(m){return (+m.cargo||0)>0?'gasto':'ingreso';}
function porMov(){var x={};S.docs.forEach(function(d){if(d.movId)(x[d.movId]=x[d.movId]||[]).push(d);});return x;}
function movEstado(m,idx){var ds=(idx||porMov())[m.id]||[];if(ds.length){var s=ds.reduce(function(a,d){return a+pagadoDoc(d);},0);return Math.abs(s-montoMov(m))<=1?'ok':'parcial';}if(m.sinDoc)return 'nota';return 'falta';}
var EST_MOV={ok:['b-ok','Respaldado'],parcial:['b-info','Respaldo parcial'],nota:['b-mut','Sin doc. (justificado)'],falta:['b-warn','Falta respaldo']};
function obsAbiertas(refTipo,refId){return S.obs.filter(function(o){return !o.resuelta&&(!refTipo||(o.refTipo===refTipo&&o.refId===refId));});}
function movById(id){for(var i=0;i<S.movs.length;i++)if(S.movs[i].id===id)return S.movs[i];return null;}
function docById(id){for(var i=0;i<S.docs.length;i++)if(S.docs[i].id===id)return S.docs[i];return null;}
function ordenFecha(a,b){return (b.fecha||'').localeCompare(a.fecha||'')||((a.orden||0)-(b.orden||0));}

  ST=fireStore();

  firebase.auth().onAuthStateChanged(async function(u){
    if(S.claiming)return;

async function procesarUsuario(u){
    var rol=null,nombre='';
    if(u.uid===OWNER_UID){rol='owner';nombre='Dueño';}
    else{try{var l=await ST.get(C.lectores,u.uid);if(l){rol='lector';nombre=l.nombre||'Contadora';}}catch(e){}}
    if(!rol){await firebase.auth().signOut();S.loginErr='Esta cuenta no tiene acceso a la contabilidad.';render();return;}
    S.user={uid:u.uid,email:u.email};S.rol=rol;S.nombre=nombre;S.tab='resumen';
    resetInact();
    if(sessionStorage.getItem('conta_log')!==u.uid){try{sessionStorage.setItem('conta_log',u.uid);}catch(e){}ST.add(C.log,{uid:u.uid,email:u.email||'',rol:rol,at:Date.now(),ua:navigator.userAgent.slice(0,200)}).catch(function(){});}
    await cargar();
}

async function aceptarInv(ev){
  ev.preventDefault();
  var em=document.getElementById('iv-email').value.trim(),p1=document.getElementById('iv-p1').value,p2=document.getElementById('iv-p2').value;
  S.invErr='';
  if(p1.length<10||!/[A-Za-zÁÉÍÓÚáéíóúñÑ]/.test(p1)||!/\d/.test(p1)){S.invErr='La clave debe tener al menos 10 caracteres, con letras y números.';render();return;}
  if(p1!==p2){S.invErr='Las claves no coinciden.';render();return;}
  var btn=document.getElementById('iv-btn');btn.disabled=true;btn.textContent='Creando cuenta…';
  S.claiming=true;
  try{
    var cred;
    try{cred=await firebase.auth().createUserWithEmailAndPassword(em,p1);}
    catch(e){if(e&&e.code==='auth/email-already-in-use')cred=await firebase.auth().signInWithEmailAndPassword(em,p1);else throw e;}
    var u=cred.user,db=firebase.firestore(),b=db.batch();
    b.set(db.collection(C.lectores).doc(u.uid),{nombre:S.inv.nombre,email:em,agregado:Date.now(),invite:INV});
    b.update(db.collection(C.invites).doc(INV),{usado:true,usadoPor:u.uid,usadoAt:Date.now()});
    await b.commit();
    history.replaceState(null,'',location.pathname);INV=null;S.claiming=false;
    await procesarUsuario(u);
    toast('¡Listo! Tu cuenta quedó creada. La próxima vez entra con tu correo y clave.');
  }catch(e){
    S.claiming=false;try{await firebase.auth().signOut();}catch(x){}
    var c=e&&e.code||'';
    S.invErr=/invalid-email/.test(c)?'El correo no es válido.':/weak-password/.test(c)?'La clave es muy débil.':/wrong-password|invalid-credential|invalid-login/.test(c)?'Ese correo ya tiene una cuenta y la clave no coincide.':/too-many/.test(c)?'Demasiados intentos. Espera unos minutos.':/permission/.test(c+(e&&e.message))?'La invitación ya no es válida (usada, anulada o vencida).':'No se pudo crear la cuenta: '+errMsg(e);
    render();
  }
}

function opcionesPer(){
  var ms={},ys={};ms[mesActual()]=1;
  S.docs.concat(S.movs,S.cartolas).forEach(function(x){if(x.mes)ms[x.mes]=1;});
  var d=new Date();for(var i=0;i<12;i++){ms[d.getFullYear()+'-'+pad(d.getMonth()+1)]=1;d.setMonth(d.getMonth()-1);}
  if(S.per.length===7)ms[S.per]=1;
  Object.keys(ms).forEach(function(m){ys[m.slice(0,4)]=1;});
  var h='<optgroup label="Mes">'+Object.keys(ms).sort().reverse().map(function(m){return '<option value="'+m+'"'+(S.per===m?' selected':'')+'>'+nomMes(m)+(cerrado(m)?' 🔒':'')+'</option>';}).join('')+'</optgroup>';
  h+='<optgroup label="Año completo">'+Object.keys(ys).sort().reverse().map(function(y){return '<option value="'+y+'"'+(S.per===y?' selected':'')+'>Año '+y+' completo</option>';}).join('')+'</optgroup>';

/* ---------- resumen ---------- */
function calc(){
  var idx=porMov(),docs=S.docs.filter(function(d){return enPer(d.mes);}),movs=S.movs.filter(function(m){return enPer(m.mes);});
  var g=docs.filter(function(d){return d.tipo==='gasto';}),i=docs.filter(function(d){return d.tipo==='ingreso';});
  function sum(a,f){return a.reduce(function(s,x){return s+f(x);},0);}
  var R={g:g,i:i,movs:movs,totG:sum(g,totalDoc),totI:sum(i,totalDoc),ivaC:sum(g,ivaDoc),ivaD:sum(i,ivaDoc),retH:sum(g,function(d){return d.docTipo==='bh'?(+d.retencion||0):0;})};
  R.cargos=sum(movs,function(m){return +m.cargo||0;});R.abonos=sum(movs,function(m){return +m.abono||0;});
  ['cargo','abono'].forEach(function(k){
    var ms=movs.filter(function(m){return (+m[k]||0)>0;}),o={doc:0,nota:0,falta:0,nFalta:0,parcial:0};
    ms.forEach(function(m){var e=movEstado(m,idx),v=+m[k];if(e==='ok')o.doc+=v;else if(e==='parcial'){var s=Math.min(v,Math.abs((idx[m.id]||[]).reduce(function(a,d){return a+pagadoDoc(d);},0)));o.doc+=s;o.falta+=v-s;o.parcial++;}else if(e==='nota')o.nota+=v;else{o.falta+=v;o.nFalta++;}});
    R[k]=o;
  });
  R.gSinBanco=g.filter(function(d){return !d.movId||!movById(d.movId);});
  R.iSinBanco=i.filter(function(d){return !d.movId||!movById(d.movId);});
  var cats={};g.forEach(function(d){cats[d.categoria||'Sin categoría']=(cats[d.categoria||'Sin categoría']||0)+totalDoc(d);});
  R.cats=Object.keys(cats).map(function(k){return [k,cats[k]];}).sort(function(a,b){return b[1]-a[1];});
  return R;
}

    +'<div class="small muted" style="margin-top:8px">Ingresos documentados que no aparecen en el banco: '+R.iSinBanco.length+' por '+$$(R.iSinBanco.reduce(function(a,d){return a+totalDoc(d);},0))+'</div></div>';
  h+='</div><div class="grid g2">';
  var max=R.cats.length?Math.max.apply(null,R.cats.map(function(c){return Math.abs(c[1]);})):1;
  h+='<div class="card"><h3>Gastos por categoría</h3>'+(R.cats.length?R.cats.map(function(c){return '<div class="cat-row"><span class="trunc" title="'+esc(c[0])+'">'+esc(c[0])+'</span><span class="cat-bar"><i style="width:'+Math.max(2,Math.abs(c[1])/max*100)+'%"></i></span><span class="num">'+$$(c[1])+'</span></div>';}).join(''):'<div class="muted small">Sin gastos en este período.</div>')+'</div>';
  h+='<div class="card"><h3>Impuestos (referencial)</h3>'

async function importar(input){
  var file=input.files[0];input.value='';if(!file)return;

    detectar();vImport();
  }catch(e){toast('No se pudo leer el archivo: '+errMsg(e),true);}

function detectar(){
  var rows=IMP.hojas[IMP.hoja].rows,hr=-1,map={};
  for(var r=0;r<Math.min(rows.length,50);r++){
    var m={},used={};
    rows[r].forEach(function(cell,ci){var t=String(cell).trim();if(!t||t.length>45)return;['ca','fecha','saldo','cargo','abono','monto','ndoc','desc'].some(function(k){if(m[k]==null&&!used[ci]&&PAT[k].test(t)){m[k]=ci;used[ci]=1;return true;}return false;});});
    if(m.fecha!=null&&(m.desc!=null||m.cargo!=null||m.monto!=null)){hr=r;map=m;break;}
  }
  if(hr<0){/* sin encabezados: adivinar por contenido */hr=-1;map={};}
  IMP.hr=hr;IMP.cols={};Object.keys(map).forEach(function(k){IMP.cols[map[k]]=k;});
}
function parseFecha(v,anio){
  if(v instanceof Date&&!isNaN(v)){return ymd(new Date(v.getTime()+12*3600e3));}
  if(typeof v==='number'&&v>20000&&v<80000){var d=new Date(Math.round((v-25569)*864e5));return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());}
  var s=String(v||'').trim(),m;
  if((m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s)))return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
  if((m=/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?\b/.exec(s))){var y=m[3]?(m[3].length===2?'20'+m[3]:m[3]):String(anio);if(+m[2]<1||+m[2]>12||+m[1]<1||+m[1]>31)return null;return y+'-'+pad(m[2])+'-'+pad(m[1]);}
  return null;
}
function parseMonto(v){
  if(typeof v==='number')return Math.round(v);
  var s=String(v||'').trim();if(!s)return NaN;
  var neg=/^\(.*\)$/.test(s)||/^-|-$/.test(s.replace(/[$\s]/g,''));
  s=s.replace(/[^\d.,]/g,'');if(!s)return NaN;
  if(s.indexOf(',')>=0&&s.indexOf('.')>=0)s=s.replace(/\./g,'').replace(',','.');
  else if(s.indexOf(',')>=0)s=/,\d{3}$/.test(s)&&s.split(',').length>2?s.replace(/,/g,''):s.replace(',','.');
  else s=s.replace(/\./g,'');

function filasImport(){
  var rows=IMP.hojas[IMP.hoja].rows,cols=IMP.cols,inv={};Object.keys(cols).forEach(function(ci){if(cols[ci])inv[cols[ci]]=+ci;});
  var out=[],errores=0,occ={};
  for(var r=IMP.hr+1;r<rows.length;r++){
    var row=rows[r];if(!row||!row.length)continue;
    var g=function(k){return inv[k]!=null?row[inv[k]]:'';};
    var fecha=parseFecha(g('fecha'),IMP.anio);if(!fecha){if(String(g('fecha')).trim()&&inv.fecha!=null)errores++;continue;}
    var cargo=0,abono=0;
    if(inv.cargo!=null||inv.abono!=null){var c=parseMonto(g('cargo')),a=parseMonto(g('abono'));cargo=isNaN(c)?0:Math.abs(c);abono=isNaN(a)?0:Math.abs(a);}
    else if(inv.monto!=null){var mo=parseMonto(g('monto'));if(isNaN(mo))continue;var t=String(g('ca')).trim().toUpperCase();if(inv.ca!=null&&t)t[0]==='C'?cargo=Math.abs(mo):abono=Math.abs(mo);else mo<0?cargo=-mo:abono=mo;}
    if(!cargo&&!abono)continue;
    var desc=String(g('desc')||'').replace(/\s+/g,' ').trim().slice(0,300),ndoc=String(g('ndoc')||'').trim().slice(0,60),sal=parseMonto(g('saldo'));
    var key=[fecha,desc,ndoc,cargo,abono,isNaN(sal)?'':sal].join('|');occ[key]=(occ[key]||0)+1;
    out.push({id:'M'+hash53(key+'#'+occ[key]),fecha:fecha,mes:fecha.slice(0,7),desc:desc||'(sin descripción)',ndoc:ndoc,cargo:cargo,abono:abono,saldo:isNaN(sal)?null:sal,orden:r,archivo:IMP.file,importado:Date.now()});
  }
  return {filas:out,errores:errores};
}

function nombresPrevios(tipo){var n={};S.docs.forEach(function(d){if(d.tipo===tipo&&d.nombre)n[d.nombre]=1;});return Object.keys(n).sort().slice(0,300).map(function(x){return '<option value="'+esc(x)+'">';}).join('');}
function fdCalc(src){
  var t=document.getElementById('fd-tipo').value,g=F.tipo==='gasto',showIva=t==='factura'||t==='nc'||(!g&&t==='boleta'),bh=t==='bh';
  document.querySelectorAll('.fd-iva').forEach(function(e){e.style.display=showIva?'':'none';});
  document.querySelectorAll('.fd-bh').forEach(function(e){e.style.display=bh?'':'none';});
  var T=document.getElementById('fd-total'),N=document.getElementById('fd-neto'),I=document.getElementById('fd-iva'),Rt=document.getElementById('fd-ret');
  var tot=intCLP(T.value),neto=intCLP(N.value),iva=intCLP(I.value);
  if(showIva){
    if(src==='total'||src==='tipo'||(src==='init'&&!N.value)){neto=Math.round(tot/1.19);iva=tot-neto;N.value=tot?neto:'';I.value=tot?iva:'';}
    else if(src==='neto'){iva=Math.round(neto*0.19);I.value=iva;T.value=neto+iva;}
    else if(src==='iva'){T.value=neto+iva;}
  }
  if(bh&&(src==='total'||src==='tipo'||(src==='init'&&!Rt.value))){Rt.value=tot?Math.round(tot*RET_HONORARIOS):'';}
  var ay='';
  if(showIva)ay='El IVA se calcula solo (19%) a partir del total; corrígelo si el documento dice otra cosa.';
  if(t==='boleta'&&g)ay='En boletas de compra el IVA no se recupera: basta con el total.';
  if(bh)ay='Total = monto bruto de la boleta. Se paga el líquido (bruto − retención '+(RET_HONORARIOS*100).toFixed(2).replace('.',',')+'%), que es lo que debería salir del banco.';
  if(t==='nc')ay='La nota de crédito se resta de los totales.';
  document.getElementById('fd-ayuda').textContent=ay;
  if(src!=='init')fdMovs();
}
function fdMovs(){
  var sel=document.getElementById('fd-mov');if(!sel)return;var cur=sel.value||sel.getAttribute('data-sel')||'';
  var fecha=document.getElementById('fd-fecha').value,t=document.getElementById('fd-tipo').value,tot=intCLP(document.getElementById('fd-total').value);
  var pag=(t==='nc'?-1:1)*(tot-(t==='bh'?intCLP(document.getElementById('fd-ret').value):0));
  var usados={};S.docs.forEach(function(d){if(d.movId&&d.id!==F.id)usados[d.movId]=1;});
  var c=S.movs.filter(function(m){return dirMov(m)===F.tipo&&(!usados[m.id]||m.id===cur)&&!cerrado(m.mes);}).map(function(m){return {m:m,da:Math.abs(montoMov(m)-pag),dd:fecha?Math.abs(dias(m.fecha,fecha)):0};})
    .filter(function(x){return x.m.id===cur||x.dd<=60;}).sort(function(a,b){return (a.da===0?0:1)-(b.da===0?0:1)||a.dd-b.dd||a.da-b.da;}).slice(0,40);
  sel.innerHTML='<option value="">— Ninguno / pagado de otra forma —</option>'+c.map(function(x){return '<option value="'+x.m.id+'"'+(x.m.id===cur?' selected':'')+'>'+(x.da===0?'✓ ':'')+fFecha(x.m.fecha)+' · '+esc(x.m.desc.slice(0,40))+' · '+$$(montoMov(x.m))+'</option>';}).join('');

  if(!cur&&c.length&&c[0].da===0&&c[0].dd<=5&&tot)sel.value=c[0].m.id;
}

function vObsDe(t,id){var ls=S.obs.filter(function(o){return o.refTipo===t&&o.refId===id;}).sort(function(a,b){return b.creado-a.creado;});return ls.length?'<h4 style="margin:16px 0 8px">Observaciones de la contadora</h4>'+ls.map(vObsItem).join(''):'';}

  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(mv.length?mv:[{'Sin datos':''}]),'Movimientos banco');

}
